<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title color="Primary">
      Registered Classes
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card class="ion-text-center">
    <img src="assets/logo/HOM3.png" alt="Logo" />
    <ion-card-header *ngIf="residentData">
      <img *ngIf="residentData.residentPhoto" [src]="residentData.residentPhoto" alt="Resident Photo" class="thumbnail" />
      <h2>{{ residentData?.residentFullName?.value || residentData?.residentFullName || 'Participant' }}</h2>
    </ion-card-header>
  </ion-card>

  <div *ngIf="!isLoading && registeredClasses.length === 0" class="ion-text-center no-classes-message">
    <p>You are not registered for any classes.</p>
  </div>

  <ion-list *ngIf="!isLoading && registeredClasses.length > 0">
    <ion-item *ngFor="let reg of registeredClasses"
              [class.selected]="selectedClass === reg"
              (click)="selectClass(reg)"
              button
              detail="false">
      <ion-label>
        <h2>{{ reg.className || ('Class ' + reg.classId) }}</h2>
        <p *ngIf="reg.classDate">{{ formatClassDate(reg.classDate) }}</p>
        <p>Status: {{ reg.status || 'Registered' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-card>
    <ion-card-content class="scrollable-content">
      <div class="wrapper">
        <button type="button" class="action-button" (click)="registerForClasses()">
          Register for Classes
        </button>
        <button type="button" class="action-button" (click)="goBack()">
          Back
        </button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
